# Bagimlilik guncellemelerini haftalik olarak otomatik acar.
# NOT: Bu depo uv.lock kullaniyor. Ekosistem "pip" oldugunda dependabot
# yalnizca pyproject.toml'u guncelliyor, uv.lock'u guncellemiyordu; boylece
# kilit dosyasi manifest'ten sapiyor ve `uv sync --locked` basarisiz oluyor.
# "uv" ekosistemi ikisini birlikte guncelliyor.version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    labels:
      - "bagimlilik"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
    labels:
      - "ci"

