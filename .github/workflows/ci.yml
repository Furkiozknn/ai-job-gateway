name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"

      # `--extra media` pulls mini-creative-toolkit from GitHub so the local
      # media capabilities are tested for real, not just skipped.
      - name: Install dependencies
        run: uv sync --group dev --extra media

      # gateway_poll.py dort depoda birebir ayni tutuluyor ve bu deponun
      # kopyasi kanonik olanidir. Buradaki kontrol, kanonik dosyanin ana daldaki
      # haliyle calisma kopyasi arasinda bir fark birakilmadigini gosteriyor --
      # yani bir degisiklik commit edilmeden once digerlerine kopyalanmasi
      # gerektigi hatirlanabilsin diye.
      - name: gateway_poll.py parmak izi
        run: python3 arac/vendor-dogrula.py --parmak

      - name: Run tests
        run: uv run pytest -v

      # Without the extra, the media-* capabilities must simply be absent and
      # everything else - including the real hosted provider - must still pass.
      - name: Tests still pass without the media extra
        run: |
          uv sync --group dev
          uv run pytest -v -q
