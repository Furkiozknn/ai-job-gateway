name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # olculen en uzun kosu 45 sn
    strategy:
      fail-fast: false
      # pyproject.toml declares 3.11-3.13; test every version it claims.
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          python-version: ${{ matrix.python-version }}

      # `--extra media` pulls mini-creative-toolkit from GitHub so the local
      # media capabilities are tested for real, not just skipped.
      - name: Install dependencies
        run: uv sync --group dev --extra media

      # gateway_poll.py dort depoda birebir ayni tutuluyor ve bu deponun
      # kopyasi kanonik olanidir. Buradaki kontrol, kanonik dosyanin ana daldaki
      # haliyle calisma kopyasi arasinda bir fark birakilmadigini gosteriyor --
      # yani bir degisiklik commit edilmeden once digerlerine kopyalanmasi
      # gerektigi hatirlanabilsin diye.
      - name: gateway_poll.py parmak izi
        run: python3 arac/vendor-dogrula.py --parmak

      - name: Run tests
        run: uv run pytest -v

      # Without the extra, the media-* capabilities must simply be absent and
      # everything else - including the real hosted provider - must still pass.
      - name: Tests still pass without the media extra
        run: |
          uv sync --group dev
          uv run pytest -v -q

  package:
    # The wheel and sdist PyPI would get, built and checked on every push,
    # not only when a release tag is pushed.
    runs-on: ubuntu-latest
    timeout-minutes: 10  # olculen en uzun kosu 10 sn
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
      - run: uv build
      # twine < 7 rejects the Metadata-Version 2.5 current hatchling writes.
      - run: uvx --from 'twine>=7' twine check --strict dist/*
