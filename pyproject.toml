[project]
name = "ai-job-gateway"
version = "0.1.0"
description = "Provider-agnostic, self-hostable reference implementation of the submit/poll/webhook async job contract used by fal.ai, BFL, and RunPod worker-comfyui."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "Furkiozkann" },
]
keywords = [
    "async-jobs",
    "inference",
    "fastapi",
    "webhooks",
    "generative-ai",
    "self-hosted",
    "polling",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
]

[project.optional-dependencies]
# No `dev` extra here on purpose: test dependencies belong in the
# `[dependency-groups]` table at the bottom, which uv installs and which is
# NOT published in the wheel. Declaring them as an extra shipped pytest to
# every consumer as an installable option for no reason.
# Local media capabilities (media-resize, media-upscale, ...). Optional so the
# gateway itself stays a four-dependency reference server; opt in to get real
# local work. Pinned to a commit in uv.lock; bump with
# `uv lock --upgrade-package mini-creative-toolkit`.
media = [
    "mini-creative-toolkit>=2.0.0",
]

[project.scripts]
ai-job-gateway = "ai_job_gateway.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_job_gateway"]

# Where `mini-creative-toolkit` comes from while it is not yet on PyPI.
#
# This is a uv source, not project metadata: `[project.optional-dependencies]`
# above declares a plain `mini-creative-toolkit>=2.0.0`, which is what ends up
# in the built wheel. The git URL lives here, is used by `uv sync`/`uv lock`
# locally and in CI, and never reaches PyPI - which rejects direct references
# outright, and would have failed the publish job on the first `v*` tag.
#
# When mini-creative-toolkit is published, delete this table; nothing else
# changes.
[tool.uv.sources]
mini-creative-toolkit = { git = "https://github.com/Furkiozknn/mini-creative-toolkit.git" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]
