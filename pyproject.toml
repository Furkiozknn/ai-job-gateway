[project]
name = "ai-job-gateway"
version = "0.1.0"
description = "Provider-agnostic, self-hostable reference implementation of the submit/poll/webhook async job contract used by fal.ai, BFL, and RunPod worker-comfyui."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "Furkiozkann" },
]
keywords = [
    "async-jobs",
    "inference",
    "fastapi",
    "webhooks",
    "generative-ai",
    "self-hosted",
    "polling",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]
# Local media capabilities (media-resize, media-upscale, ...). Optional so the
# gateway itself stays a four-dependency reference server; opt in to get real
# local work. Pinned to a commit in uv.lock; bump with
# `uv lock --upgrade-package mini-creative-toolkit`.
media = [
    "mini-creative-toolkit @ git+https://github.com/Furkiozknn/mini-creative-toolkit.git",
]

[project.scripts]
ai-job-gateway = "ai_job_gateway.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_job_gateway"]

# The `media` extra points at a git URL. Hatchling refuses direct references
# by default because PyPI would reject them; this package is not on PyPI.
[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]
