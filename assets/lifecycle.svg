<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410" width="1200" height="410" role="img" aria-label="The job lifecycle: submit returns an id immediately, the job moves pending to processing to ready or error, and a terminal job past its 30 minute result window reads as expired - a status computed at read time rather than written to storage. Callers either poll the job id or receive a signed, SSRF-checked webhook.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#111a2b"/>
      <stop offset="100%" stop-color="#0b1626"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4c8dff"/>
      <stop offset="50%" stop-color="#39d3bb"/>
      <stop offset="100%" stop-color="#a371f7"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b98a9"/>
    </marker>
  </defs>
  <rect width="1200" height="410" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="4" fill="url(#accent)"/>
  <text x="40" y="56" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" font-weight="700" fill="#e6edf3">the job lifecycle</text>
  <text x="40" y="84" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#8b98a9">every state below is one a caller can observe - including the one nothing ever writes to storage</text>
  <g>
    <rect x="40" y="150" width="180" height="66" rx="12" fill="#131a26" stroke="#6cb6ff" stroke-width="1.6"/>
    <text x="130" y="179" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#6cb6ff">POST /v1/{cap}</text>
    <text x="130" y="199" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#8b98a9">returns an id, never blocks</text>
    <text x="40" y="244" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#6cb6ff">Idempotency-Key: same key,</text>
    <text x="40" y="262" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#5c6b7f">same job - submissions are</text>
    <text x="40" y="280" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#5c6b7f">serialised per key, not globally</text>
    <rect x="288" y="150" width="150" height="66" rx="12" fill="#131a26" stroke="#8b98a9" stroke-width="1.6"/>
    <text x="363" y="179" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#8b98a9">pending</text>
    <text x="363" y="199" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#8b98a9">queued behind the cap</text>
    <text x="288" y="244" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#5c6b7f">max_concurrent_jobs 100:</text>
    <text x="288" y="262" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#5c6b7f">queued jobs stay honestly</text>
    <text x="288" y="280" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#5c6b7f">pending, not 'processing'</text>
    <rect x="506" y="150" width="150" height="66" rx="12" fill="#131a26" stroke="#f0b429" stroke-width="1.6"/>
    <text x="581" y="179" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#f0b429">processing</text>
    <text x="581" y="199" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#8b98a9">provider is running</text>
    <text x="506" y="244" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#f0b429">job_timeout 600s:</text>
    <text x="506" y="262" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#5c6b7f">a provider that never returns</text>
    <text x="506" y="280" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#5c6b7f">is failed honestly, not hung</text>
    <rect x="724" y="106" width="150" height="60" rx="12" fill="#131a26" stroke="#3fb950" stroke-width="1.6"/>
    <text x="799" y="132" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#3fb950">ready</text>
    <text x="799" y="152" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#8b98a9">result attached</text>
    <rect x="724" y="194" width="150" height="60" rx="12" fill="#131a26" stroke="#f2777a" stroke-width="1.6"/>
    <text x="799" y="220" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#f2777a">error</text>
    <text x="799" y="240" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#8b98a9">reason attached</text>
    <rect x="960" y="150" width="200" height="66" rx="12" fill="#131a26" stroke="#5c6b7f" stroke-width="1.6" stroke-dasharray="6 5"/>
    <text x="1060" y="179" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#5c6b7f">expired</text>
    <text x="1060" y="199" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#8b98a9">result cleared, id still answers</text>
    <text x="960" y="244" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#5c6b7f">result_expires_at = +30 min.</text>
    <text x="960" y="262" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#5c6b7f">Computed at read time, never</text>
    <text x="960" y="280" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#5c6b7f">written - and never a 404.</text>
    <path d="M220 183 L284 183" stroke="#8b98a9" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
    <path d="M438 183 L502 183" stroke="#8b98a9" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
    <path d="M656 172 L720 140" stroke="#8b98a9" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
    <path d="M656 194 L720 222" stroke="#8b98a9" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
    <path d="M874 136 L956 172" stroke="#8b98a9" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
    <path d="M874 224 L956 194" stroke="#8b98a9" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  </g>
  <g>
    <path d="M40 183 L22 183 L22 330 L596 330" stroke="#8b98a9" stroke-width="1.6" fill="none" stroke-dasharray="5 5"/>
    <rect x="600" y="306" width="210" height="48" rx="12" fill="#131a26" stroke="#8b98a9" stroke-width="1.6"/>
    <text x="705" y="335" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#8b98a9">GET /v1/jobs/{id}</text>
    <rect x="860" y="306" width="300" height="48" rx="12" fill="#131a26" stroke="#6cb6ff" stroke-width="1.6"/>
    <text x="1010" y="335" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#6cb6ff">or: signed webhook, SSRF-checked</text>
    <path d="M810 330 L856 330" stroke="#8b98a9" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
    <text x="600" y="380" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#8b98a9">Both paths read the same job record - polling is never a second-class citizen.</text>
  </g>
</svg>
