<text x="390.0" y="301.0" fill="#d8d3c6"> }</text>
<text x="22.0" y="341.0" fill="#c9a961" font-weight="600">$ </text>
<text x="37.7" y="341.0" fill="#f2efe6">POST /v1/mock-generate</text>
<text x="209.9" y="341.0" fill="#6b6b77">  webhook_url=</text>
