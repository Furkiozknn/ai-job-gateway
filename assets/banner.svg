<text x="988" y="167" font-family="'Cascadia Code','JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11" fill="#5c5c68">refused, not called</text><text x="56" y="228" font-family="'Cascadia Code','JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12" fill="#5c5c68">Provider-agnostic. FastAPI. submit → poll → webhook. MIT.</text></svg>